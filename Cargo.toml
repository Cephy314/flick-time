[package]
name = "flick-time"
version = "0.1.0"
edition = "2024"
authors = ["Victoria B. Sagady"]
license = "MIT or Apache-2.0"
keywords = ["media","time","fps","samples","fixed-point"]
categories = ["data-structures","date-and-time","game-development","multimedia"]
publish = false

[dependencies]

[lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
missing_docs = "deny"
unused_crate_dependencies = "warn"
unused_results = "deny"
missing_debug_implementations = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
unwrap_used = "deny"


