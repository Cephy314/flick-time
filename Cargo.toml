[package]
name = "flick-time"
description = "Fixed-point time type for media, simulation and games"
version = "0.1.0"
edition = "2024"
authors = ["Victoria B. Sagady <victora@victorabsagady.com>"]
license = "MIT or Apache-2.0"
keywords = ["media","time","fps","samples","fixed-point"]
categories = ["data-structures","date-and-time","game-development","multimedia"]
publish = false

[dependencies]
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"]}
rkyv = { version = "0.8", optional = true, default-features = false}

[features]
serde = ["dep:serde"]
rkyv = ["dep:rkyv"]

[lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
missing_docs = "deny"
unused_crate_dependencies = "warn"
unused_results = "deny"
missing_debug_implementations = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
unwrap_used = "deny"


